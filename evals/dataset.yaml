  - id: a13
    question_id: tech_composition
    score: 4
    label_status: draft
    reason: "Correct, coupling, testing, and when inheritance is still right."
    answer: >
      Inheritance is an is-a relationship, a Dog is an Animal, and composition is has-a, a Car has an
      Engine. Inheritance couples the subclass tightly to the parent so changes in the base class can
      break children, and deep hierarchies get hard to reason about. With composition I hold the
      collaborators as fields and can swap them, which also makes testing easier because I can pass a
      fake Engine. I'd still use inheritance when there's a real is-a relationship with shared behavior
      and the subtype can be substituted anywhere the parent is used, like different payment providers
      behind one interface.

  - id: a14
    question_id: tech_composition
    score: 3
    label_status: draft
    reason: "Correct and example, shallow on consequences."
    answer: >
      Inheritance is when a class extends another class and gets its methods, is-a. Composition is when
      a class contains other objects, has-a. I'd prefer composition because it's more flexible, you can
      change parts without breaking a big hierarchy. For example a Car has an Engine rather than
      extending it.

  - id: a15
    question_id: tech_composition
    score: 2
    label_status: draft
    reason: "Roughly right terms but defined loosely, no example or consequences."
    answer: >
      Inheritance is for reusing code and composition is for combining classes. Composition is better
      because inheritance is bad in general and you should avoid it.

