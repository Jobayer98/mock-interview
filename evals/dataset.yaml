    reason: "Correct difference and preference; missing shared-branch rule."
    answer: >
      Merge takes two branches and combines them with a merge commit, so the history shows that they
      diverged and came back together. Rebase takes my commits and replays them on top of the other
      branch so the history is a straight line. I like to rebase my feature branch onto main before
      opening a pull request to keep history clean, and I use merge when I want to keep the exact history.

