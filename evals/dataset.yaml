  - id: a19
    question_id: beh_stuck_bug
    score: 4
    label_status: draft
    reason: "Specific, systematic, outcome, and reflection with changed behavior."
    answer: >
      In my final-year project our Flask API returned random 500 errors only under load. I couldn't
      reproduce it locally, so first I added structured logging with request ids and wrote a small
      script to hit the endpoint concurrently, which reproduced it. The logs showed two requests
      writing to the same SQLite connection, which isn't thread safe. I spent about two days on it and
      asked my TA after the first day when my hypotheses ran out; she suggested checking connection
      sharing. I switched to a per-request connection and the errors disappeared, and I confirmed with
      the load script running 500 requests. Since then I write a reproduction script before changing
      any code, and I add logging early instead of guessing.

