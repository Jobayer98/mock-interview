  - id: a01
    question_id: tech_hashmap
    score: 4
    label_status: draft
    reason: "Correct O(1) vs O(n), hashable keys, collisions, memory, concrete example."
    answer: >
      I'd use a dictionary when I need to look things up by a key. A hash map computes a hash of the key
      and jumps to a bucket, so lookup and insert are O(1) on average, whereas finding a value in a list
      means scanning it, O(n). A typical case is counting word frequencies or caching results by id.
      The trade-offs are that keys have to be hashable and unique, it uses more memory than a list, and
      in the worst case with lots of collisions it degrades toward O(n). Also it's not sorted by key,
      so if I need ordered range queries I'd use a sorted structure instead.

  - id: a02
