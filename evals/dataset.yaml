    answer: >
      A good unit test is fast, independent, and checks one thing, and it gives the same result every
      time. For a discount function I'd test a normal total, a total of zero, a negative total to see
      if it throws or returns zero, and the boundary where the discount threshold starts, like 99.99
      versus 100. I'd name the tests so a failure explains what broke.

