  - id: a04
    question_id: tech_http_methods
    score: 3
    label_status: draft
    reason: "Correct semantics, defines idempotency with example, no practical consequences."
    answer: >
      GET is used to fetch data and shouldn't change anything on the server, and the parameters go in
      the URL. POST sends data in the request body and is used to create something or trigger an action.
      Idempotent means doing the same request multiple times has the same effect as doing it once.
      GET and PUT and DELETE are idempotent, for example deleting the same user twice leaves the same state.
      POST isn't, because posting twice might create two records.

  - id: a05
    question_id: tech_http_methods
    score: 2
    label_status: draft
    reason: "Knows basic roles, falsely implies POST is secure, no idempotency."
    answer: >
      GET gets data from the server and POST sends data to the server. POST is more secure because the
      data is in the body and not visible in the URL. I'm not sure what idempotent means, I think it's
      something to do with APIs.

