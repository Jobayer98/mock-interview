    answer: >
      GET and POST are two ways of writing to the database. Idempotent means the request is encrypted.
      POST is idempotent since it always works.

  - id: a07
    question_id: tech_sql_joins
    score: 4
    label_status: draft
    reason: "Correct, example, NULL handling and WHERE pitfall."
    answer: >
      An INNER JOIN only returns rows where there's a match in both tables, like users joined to orders
      gives only users who have at least one order. A LEFT JOIN returns every row from the left table and
      fills the right-side columns with NULL when there's no match, so I'd use it to list all users
      including those with zero orders. A neat trick is LEFT JOIN plus WHERE orders.id IS NULL to find
      users who never ordered. One pitfall is putting a filter on the right table in the WHERE clause,
      which removes the NULL rows and quietly turns the LEFT JOIN into an inner join; that condition
      belongs in the ON clause.

  - id: a08
    question_id: tech_sql_joins
    score: 3
    label_status: draft
    reason: "Correct with example, no depth on NULL pitfalls."
    answer: >
      Inner join gives you the rows that match in both tables. Left join gives all the rows from the
      left table and the matching ones from the right, and if there's no match the right columns are NULL.
      For example with customers and orders, inner join shows customers who ordered and left join shows
      all customers even those with no orders.

  - id: a09
    question_id: tech_sql_joins
    score: 2
    label_status: draft
    reason: "Blurry, no example, partially swapped."
    answer: >
      Joins combine two tables. Inner join is when you join everything and left join is when you join
      the left side more. I use left join mostly because it works most of the time.

  - id: a10
