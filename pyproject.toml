[project]
name = "mockinterview"
version = "0.0.1"
description = "AI mock interview agent (junior software engineer, CLI)"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "pypdf>=5", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
live = ["livekit-agents[silero]~=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
